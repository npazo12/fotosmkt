<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
(function () {
  function ajustar() {
    var ancho = window.innerWidth;
    var tactil = window.matchMedia('(pointer: coarse)').matches;
    var z = (tactil && ancho > 440 && ancho <= 1000) ? ancho / 400 : 1;
    document.documentElement.style.zoom = (z === 1) ? '' : String(z);
  }
  ajustar();
  window.addEventListener('resize', ajustar);
})();
</script>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#3a6fb7">
<title>Evidencias</title>
<link rel="icon" type="image/png" href="icono.png">
<link rel="apple-touch-icon" href="icono.png">
<meta name="apple-mobile-web-app-title" content="Evidencias">
<style>
  :root {
    --bg: #e6eaf1;
    --card: #ffffff;
    --texto: #1d2330;
    --suave: #6b7485;
    --azul: #3a6fb7;
    --azul-osc: #2f5a96;
    --borde: #c3cad6;
    --ok: #2e9e5b;
    --err: #c9423a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b;
      --card: #1c212b;
      --texto: #f1f3f7;
      --suave: #98a1b3;
      --borde: #343b4a;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--texto);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .top {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 18px;
    background: var(--card);
    border-bottom: 1px solid var(--borde);
    font-weight: 600; font-size: 15px;
  }
  .top i { width: 9px; height: 9px; border-radius: 50%; background: var(--azul); flex: none; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 18px 16px 40px; }

  .boton-grande {
    width: 100%; min-height: 175px;
    border: 0; border-radius: 26px;
    background: var(--azul); color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    font-size: 26px; font-weight: 700; font-family: inherit;
    box-shadow: 0 14px 30px rgba(58, 111, 183, .35);
    cursor: pointer;
  }
  .boton-grande:active { background: var(--azul-osc); transform: scale(.985); }
  .boton-grande svg { width: 52px; height: 52px; }
  .compacto .boton-grande { min-height: 110px; font-size: 21px; gap: 8px; }
  .compacto .boton-grande svg { width: 38px; height: 38px; }

  .boton-sec {
    width: 100%; margin-top: 14px; padding: 15px;
    border: 1.5px solid var(--borde); border-radius: 999px;
    background: transparent; color: var(--azul);
    font-size: 17px; font-weight: 600; font-family: inherit;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    cursor: pointer;
  }
  .boton-sec svg { width: 22px; height: 22px; }
  .boton-sec:active { background: rgba(58, 111, 183, .1); }

  .hint { text-align: center; color: var(--suave); font-size: 16px; margin: 22px 8px 0; }
  .invalido {
    display: none; text-align: center; margin: 30px 10px;
    padding: 22px; border-radius: 18px; background: var(--card);
    color: var(--err); font-weight: 600; line-height: 1.5;
  }

  .estado { display: none; text-align: center; font-weight: 600; margin: 20px 0 8px; font-size: 16px; }
  .estado.visible { display: block; }
  .estado small { display: block; font-weight: 400; color: var(--suave); margin-top: 4px; font-size: 13px; }
  .barra { display: none; height: 6px; border-radius: 6px; background: var(--borde); overflow: hidden; margin: 6px 0 14px; }
  .barra.visible { display: block; }
  .barra i { display: block; height: 100%; width: 0; background: var(--azul); transition: width .3s; }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .tile { position: relative; aspect-ratio: 1; border-radius: 14px; overflow: hidden; background: var(--card); border: 1px solid var(--borde); }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .vel {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, .38); color: #fff; font-size: 12px; font-weight: 600; text-align: center; padding: 6px; gap: 6px;
  }
  .spin {
    width: 26px; height: 26px; border-radius: 50%;
    border: 3px solid rgba(255, 255, 255, .35); border-top-color: #fff;
    animation: gira .8s linear infinite;
  }
  @keyframes gira { to { transform: rotate(360deg); } }
  .tile.ok .vel { display: none; }
  .tile.err .vel { background: rgba(201, 66, 58, .72); cursor: pointer; }
  .tile.err .spin { display: none; }
  .check {
    display: none; position: absolute; right: 6px; bottom: 6px; width: 26px; height: 26px; border-radius: 50%;
    background: var(--ok); color: #fff; align-items: center; justify-content: center;
  }
  .check svg { width: 16px; height: 16px; }
  .tile.ok .check { display: flex; }
  .quitar {
    position: absolute; top: 5px; right: 5px; width: 26px; height: 26px; border-radius: 50%;
    border: 0; background: rgba(0, 0, 0, .55); color: #fff; font-size: 18px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }

  .overlay {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, .35); z-index: 50;
  }
  .overlay.visible { display: flex; animation: aparece .25s ease; }
  @keyframes aparece { from { opacity: 0; } to { opacity: 1; } }
  .listo-card {
    background: var(--card); border-radius: 26px; padding: 28px 40px; text-align: center;
    box-shadow: 0 20px 50px rgba(0, 0, 0, .3);
  }
  .listo-card .circ {
    width: 74px; height: 74px; border-radius: 50%; background: var(--ok); color: #fff;
    display: flex; align-items: center; justify-content: center; margin: 0 auto 12px;
  }
  .listo-card .circ svg { width: 40px; height: 40px; }
  .listo-card b { font-size: 22px; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: #222; color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 14px;
    display: none; z-index: 60; max-width: 90%;
  }
  .toast.visible { display: block; }
</style>
</head>
<body>

<div class="top"><i></i><span>Mercadotecnia · Tampico</span></div>

<div class="wrap" id="vista">
  <!-- Cámara: abre directamente la cámara del celular -->
  <input type="file" id="inpCam" accept="image/*" capture="environment" hidden>
  <!-- Galería: permite elegir varias fotos -->
  <input type="file" id="inpGal" accept="image/*" multiple hidden>

  <div id="invalido" class="invalido"></div>

  <button type="button" id="btnCam" class="boton-grande">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.2a2 2 0 0 0 1.6-.8l.7-1A2 2 0 0 1 11.6 3.5h.8a2 2 0 0 1 1.6.7l.7 1a2 2 0 0 0 1.6.8h1.2A2.5 2.5 0 0 1 20 8.5v8A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5z"/><circle cx="12" cy="12.5" r="3.6"/></svg>
    <span id="btnCamTxt">Tomar foto</span>
  </button>

  <button type="button" id="btnGal" class="boton-sec">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 9"/></svg>
    <span>Elegir foto del celular</span>
  </button>

  <div id="hint" class="hint">Toma una foto o elige varias de tu galería.</div>

  <div id="estado" class="estado"></div>
  <div id="barra" class="barra"><i id="barraRelleno"></i></div>
  <div id="grid" class="grid"></div>
</div>

<div id="overlay" class="overlay" aria-live="polite">
  <div class="listo-card">
    <div class="circ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <b>¡Listo!</b>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
// =====================================================================
// CONFIGURACIÓN: aquí va la URL de tu aplicación de Apps Script.
// Es la URL que termina en /exec (Implementar > Administrar implementaciones > Copiar).
// Pégala entre las comillas, sustituyendo el texto de ejemplo.
// =====================================================================
const APP_URL = 'https://script.google.com/macros/s/AKfycbyTcAhSkOUtiHMWXgwch8GSr_MNoSnNVgw0nB1TgQW2suhj6Hpgao4izx-1zPPZd8w/exec';
// =====================================================================

const LADO_MAX = 1600;
const CALIDAD = 0.82;
const MINI_LADO = 320;
const CONCURRENCIA = 2;
const REINTENTOS = 4;
const TIMEOUT_MS = 60000;
const ESPERAS = [0, 1200, 3500, 8000];

const CLAVE = (new URLSearchParams(location.search).get('clave') || '').trim();
const $ = function(id) { return document.getElementById(id); };

let items = [];
let cola = [];
let activas = 0;
let contador = 0;
let timerListo = null;
let timerLimpiar = null;
let toastTimer = null;

function mostrarToast(txt) {
  const t = $('toast');
  t.textContent = txt;
  t.classList.add('visible');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { t.classList.remove('visible'); }, 3500);
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

// ---------- Arranque: se valida el enlace ----------
(function iniciar() {
  let problema = '';
  if (APP_URL.indexOf('script.google.com') === -1) {
    problema = 'Falta configurar la página.<br>Avisa a Mercadotecnia.';
  } else if (!CLAVE) {
    problema = 'Este enlace no es válido.<br>Pide el enlace correcto a Mercadotecnia.';
  }
  if (problema) {
    $('invalido').innerHTML = problema;
    $('invalido').style.display = 'block';
    $('btnCam').style.display = 'none';
    $('btnGal').style.display = 'none';
    $('hint').style.display = 'none';
    return;
  }
  $('btnCam').onclick = function() { $('inpCam').click(); };
  $('btnGal').onclick = function() { $('inpGal').click(); };
  $('inpCam').onchange = function() { elegidas(this); };
  $('inpGal').onchange = function() { elegidas(this); };
  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible') reintentarPendientes();
  });
  window.addEventListener('online', reintentarPendientes);
})();

function elegidas(input) {
  const archivos = Array.from(input.files || []);
  input.value = '';
  agregar(archivos);
}

function esImagen(f) {
  return /^image\//i.test(f.type || '') || /\.(jpe?g|png|webp|heic|heif)$/i.test(f.name || '');
}

function agregar(archivos) {
  archivos = archivos.filter(esImagen);
  if (!archivos.length) return;
  clearTimeout(timerListo);
  clearTimeout(timerLimpiar);
  $('overlay').classList.remove('visible');
  $('hint').style.display = 'none';
  $('vista').classList.add('compacto');
  $('btnCamTxt').textContent = 'Tomar otra foto';
  archivos.forEach(function(file) {
    const item = { id: ++contador, file: file, estado: 'cola', serverId: '', miniUrl: '', tile: null, error: '' };
    items.push(item);
    crearTile(item);
    cola.push(item);
  });
  actualizarEstado();
  bombear();
}

function crearTile(item) {
  const t = document.createElement('div');
  t.className = 'tile';
  t.innerHTML =
    '<img alt="" style="display:none">' +
    '<div class="vel"><div class="spin"></div><span class="err-txt"></span></div>' +
    '<span class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>' +
    '<button type="button" class="quitar" aria-label="Quitar esta foto">&times;</button>';
  t.querySelector('.vel').onclick = function() { if (item.estado === 'error') reintentar(item); };
  t.querySelector('.quitar').onclick = function(e) { e.stopPropagation(); quitar(item); };
  item.tile = t;
  $('grid').insertBefore(t, $('grid').firstChild);
}

function pintar(item) {
  const t = item.tile;
  if (!t) return;
  t.classList.toggle('ok', item.estado === 'ok');
  t.classList.toggle('err', item.estado === 'error');
  t.querySelector('.err-txt').textContent = item.estado === 'error' ? 'Toca para reintentar' : '';
  t.title = item.estado === 'error' ? (item.error || '') : '';
  if (item.miniUrl) {
    const img = t.querySelector('img');
    img.src = item.miniUrl;
    img.style.display = 'block';
  }
}

function bombear() {
  while (activas < CONCURRENCIA && cola.length) {
    const item = cola.shift();
    activas++;
    procesar(item).then(function() {
      activas--;
      actualizarEstado();
      bombear();
    });
  }
}

// ---------- Preparar la foto (reducirla antes de subirla) ----------
function cargarImagen(file) {
  return new Promise(function(resolve, reject) {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = function() { resolve({ img: img, url: url }); };
    img.onerror = function() { URL.revokeObjectURL(url); reject(new Error('No se pudo leer esta foto.')); };
    img.src = url;
  });
}

async function prepararImagen(file) {
  const cargada = await cargarImagen(file);
  const img = cargada.img;
  try {
    const w = img.naturalWidth, h = img.naturalHeight;
    const e = Math.min(1, LADO_MAX / Math.max(w, h));
    const cw = Math.max(1, Math.round(w * e)), ch = Math.max(1, Math.round(h * e));
    const c = document.createElement('canvas');
    c.width = cw; c.height = ch;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, cw, ch);
    ctx.drawImage(img, 0, 0, cw, ch);
    const grande = c.toDataURL('image/jpeg', CALIDAD);

    const em = Math.min(1, MINI_LADO / Math.max(w, h));
    const mw = Math.max(1, Math.round(w * em)), mh = Math.max(1, Math.round(h * em));
    const m = document.createElement('canvas');
    m.width = mw; m.height = mh;
    m.getContext('2d').drawImage(img, 0, 0, mw, mh);
    let q = 0.6;
    let mini = m.toDataURL('image/jpeg', q);
    while (mini.length > 42000 && q > 0.3) { q -= 0.1; mini = m.toDataURL('image/jpeg', q); }

    return { base64: grande.split(',')[1], miniUrl: mini, miniBase64: mini.split(',')[1] };
  } finally {
    URL.revokeObjectURL(cargada.url);
  }
}

// Las fotos se preparan una por una para no saturar la memoria del celular.
let cadena = Promise.resolve();
function enSerie(fn) {
  const p = cadena.then(function() { return fn(); });
  cadena = p.catch(function() {});
  return p;
}

function nuevoId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 6);
}
function esperar(ms) { return new Promise(function(r) { setTimeout(r, ms); }); }

// ---------- Comunicación con Apps Script ----------
// Se envía como texto simple para que el navegador no pida permiso previo (CORS).
async function llamarServidor(cuerpo) {
  const ctrl = new AbortController();
  const t = setTimeout(function() { ctrl.abort(); }, TIMEOUT_MS);
  try {
    const r = await fetch(APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(cuerpo),
      redirect: 'follow',
      signal: ctrl.signal
    });
    const txt = await r.text();
    try {
      return JSON.parse(txt);
    } catch (e) {
      throw new Error('El servidor respondió algo inesperado.');
    }
  } catch (e) {
    if (e && e.name === 'AbortError') throw new Error('Google tardó demasiado en responder.');
    throw new Error(e && e.message ? e.message : 'Sin conexión');
  } finally {
    clearTimeout(t);
  }
}

// Errores que no se arreglan reintentando.
function esDefinitivo(msg) {
  return /Enlace no válido|no es una foto válida|demasiado grande|No llegó la foto/i.test(String(msg || ''));
}

async function procesar(item) {
  item.estado = 'subiendo';
  item.error = '';
  pintar(item);
  try {
    if (!item.prep) {
      item.prep = await enSerie(function() { return prepararImagen(item.file); });
      item.miniUrl = item.prep.miniUrl;
      pintar(item);
    }
    if (!item.uid) item.uid = nuevoId();   // mismo identificador en cada reintento: no se guarda dos veces

    let res = null, ultimoError = null;
    for (let intento = 0; intento < REINTENTOS && !(res && res.ok); intento++) {
      if (intento > 0) await esperar(ESPERAS[Math.min(intento, ESPERAS.length - 1)]);
      try {
        res = await llamarServidor({
          accion: 'subirFoto',
          clave: CLAVE,
          uid: item.uid,
          base64: item.prep.base64,
          mini: item.prep.miniBase64
        });
        ultimoError = null;
        if (res && !res.ok && esDefinitivo(res.mensaje)) break;
      } catch (e) { ultimoError = e; res = null; }
    }
    if (res && res.ok) {
      item.estado = 'ok';
      item.serverId = res.id;
      item.prep = null;               // libera memoria
    } else {
      item.estado = 'error';
      item.error = (res && res.mensaje) || (ultimoError && ultimoError.message) || 'No se pudo subir.';
    }
  } catch (e) {
    item.estado = 'error';
    item.error = e && e.message ? e.message : 'No se pudo leer esta foto.';
  }
  pintar(item);
}

function reintentar(item) {
  item.estado = 'cola';
  item.error = '';
  pintar(item);
  item.tile.classList.remove('err');
  cola.push(item);
  actualizarEstado();
  bombear();
}

function reintentarPendientes() {
  items.forEach(function(item) {
    if (item.estado === 'error' && !esDefinitivo(item.error) && (item.auto || 0) < 3) {
      item.auto = (item.auto || 0) + 1;
      reintentar(item);
    }
  });
}

function quitarLocal(item) {
  item.tile.remove();
  items = items.filter(function(x) { return x !== item; });
  cola = cola.filter(function(x) { return x !== item; });
  actualizarEstado();
}

function quitar(item) {
  if (item.estado === 'subiendo') return;
  if (!item.serverId) { quitarLocal(item); return; }   // no llegó a subirse: solo se quita de la pantalla
  item.tile.style.opacity = '.4';
  llamarServidor({ accion: 'eliminarFoto', clave: CLAVE, id: item.serverId })
    .then(function(res) {
      if (res && res.ok) {
        quitarLocal(item);
      } else {
        item.tile.style.opacity = '';
        mostrarToast((res && res.mensaje) || 'No se pudo quitar la foto.');
      }
    })
    .catch(function() {
      item.tile.style.opacity = '';
      mostrarToast('No se pudo quitar la foto.');
    });
}

// ---------- Mensajes de estado ----------
function actualizarEstado() {
  const total = items.length;
  const ok = items.filter(function(x) { return x.estado === 'ok'; }).length;
  const err = items.filter(function(x) { return x.estado === 'error'; }).length;
  const pendientes = total - ok - err;
  const est = $('estado');
  const barra = $('barra');
  if (!total) { est.classList.remove('visible'); barra.classList.remove('visible'); return; }
  est.classList.add('visible');
  if (pendientes > 0) {
    est.innerHTML = 'Subiendo ' + (ok + 1 > total ? total : ok + 1) + ' de ' + total + '...';
    barra.classList.add('visible');
    $('barraRelleno').style.width = Math.round((ok / total) * 100) + '%';
  } else {
    barra.classList.remove('visible');
    if (err > 0) {
      const detalle = items.filter(function(x) { return x.estado === 'error' && x.error; }).map(function(x) { return x.error; }).pop() || '';
      est.innerHTML = ok + ' de ' + total + ' listas<small>Toca las que tienen error para reintentar.' + (detalle ? '<br>' + esc(detalle) : '') + '</small>';
    } else {
      est.innerHTML = '&#10003; ' + ok + (ok === 1 ? ' foto lista' : ' fotos listas') + '<small>Ya aparecen disponibles para usarlas en las facturas.</small>';
      mostrarListoYLimpiar();
    }
  }
}

function mostrarListoYLimpiar() {
  const ov = $('overlay');
  clearTimeout(timerListo);
  clearTimeout(timerLimpiar);
  ov.classList.remove('visible');
  void ov.offsetWidth;
  ov.classList.add('visible');

  timerListo = setTimeout(function() { ov.classList.remove('visible'); }, 1650);

  timerLimpiar = setTimeout(function() {
    if (cola.length > 0 || activas > 0) return;
    items = [];
    $('grid').innerHTML = '';
    $('estado').classList.remove('visible');
    $('estado').innerHTML = '';
    $('barra').classList.remove('visible');
    $('barraRelleno').style.width = '0%';
    $('vista').classList.remove('compacto');
    $('btnCamTxt').textContent = 'Tomar foto';
    $('hint').style.display = '';
  }, 1950);
}
</script>
</body>
</html>
